<!-- author: Arne Blumentritt -->

<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:composite="http://java.sun.com/jsf/composite"
	  xmlns:f="http://java.sun.com/jsf/core"
	  xmlns:h="http://java.sun.com/jsf/html"
	  xmlns:ui="http://java.sun.com/jsf/facelets">

<!-- INTERFACE -->
<composite:interface>
	<composite:attribute name="consent" type="org.emau.icmvc.ganimed.ttp.cm2.frontend.model.WebConsent" required="true" />
	<composite:attribute name="moduleKey" type="org.emau.icmvc.ganimed.ttp.cm2.dto.ModuleKeyDTO" required="false" />
	<composite:attribute name="policyKey" type="org.emau.icmvc.ganimed.ttp.cm2.dto.PolicyKeyDTO" required="false" />
</composite:interface>

<!-- IMPLEMENTATION -->
<composite:implementation>

	<!-- Consent and Module -->
	<ui:fragment rendered="#{cc.getValueExpression('policyKey') == null}">
		<!-- Valid from date of consent is in past (VALID) -->
		<h:outputFormat rendered="#{cc.attrs.consent.validFromIsSet and !cc.attrs.consent.legalConsentDateInFuture}"
						styleClass="m-0 white-space-nowrap tag tag_lightgreen round" value="#{msg['common.validSince.on']}">
			<f:param value="#{consentController.dateToString(cc.attrs.consent.consentDates.legalConsentDate, 'date')}" />
		</h:outputFormat>

		<!-- Valid from date of consent is in future (INVALID) -->
		<h:outputFormat rendered="#{cc.attrs.consent.legalConsentDateInFuture}"
						styleClass="m-0 white-space-nowrap tag tag_lightorange round" value="#{msg['common.validFrom.on']}">
			<f:param value="#{consentController.dateToString(cc.attrs.consent.consentDates.legalConsentDate, 'date')}" />
		</h:outputFormat>

		<!-- Only Consent -->
		<ui:fragment rendered="#{cc.getValueExpression('moduleKey') == null}">
			<!-- Consent expires at date in future (VALID) -->
			<h:outputFormat rendered="#{cc.attrs.consent.consentFullyExpires and not cc.attrs.consent.consentFullyExpired}"
							styleClass="m-0 white-space-nowrap tag tag_lightgreen round" value="#{msg['common.expires.on']}">
				<f:param value="#{consentController.dateToString(cc.attrs.consent.consentDates.consentExpirationDate, 'date')}" />
			</h:outputFormat>

			<!-- Consent expired at date in past (INVALID) -->
			<h:outputFormat rendered="#{cc.attrs.consent.consentFullyExpired}"
							styleClass="m-0 white-space-nowrap tag tag_lightred round" value="#{msg['common.expired.on']}">
				<f:param value="#{consentController.dateToString(cc.attrs.consent.consentDates.consentExpirationDate, 'date')}" />
			</h:outputFormat>

			<!-- Consent partly expires -->
			<h:outputText rendered="#{cc.attrs.consent.consentPartlyExpires}"
						  styleClass="m-0 white-space-nowrap tag tag_lightgreen round" value="#{msg['common.partlyExpires']}" />

			<!-- Consent partly expired -->
			<h:outputText rendered="#{cc.attrs.consent.consentPartlyExpired}"
						  styleClass="m-0 white-space-nowrap tag tag_lightred round" value="#{msg['common.partlyExpired']}" />
		</ui:fragment>

		<!-- Only Module -->
		<ui:fragment rendered="#{cc.getValueExpression('moduleKey') != null}">
			<!-- Module expires at date in future (VALID) -->
			<h:outputFormat rendered="#{cc.attrs.consent.getModuleFullyExpires(cc.attrs.moduleKey) and not cc.attrs.consent.getModuleFullyExpired(cc.attrs.moduleKey)}"
							styleClass="m-0 white-space-nowrap tag tag_lightgreen round" value="#{msg['common.expires.on']}">
				<f:param value="#{consentController.dateToString(cc.attrs.consent.consentDates.moduleExpirations.get(cc.attrs.moduleKey), 'date')}" />
			</h:outputFormat>

			<!-- Module expired at date in past (INVALID) -->
			<h:outputFormat rendered="#{cc.attrs.consent.getModuleFullyExpired(cc.attrs.moduleKey)}"
							styleClass="m-0 white-space-nowrap tag tag_lightred round" value="#{msg['common.expired.on']}">
				<f:param value="#{consentController.dateToString(cc.attrs.consent.consentDates.moduleExpirations.get(cc.attrs.moduleKey), 'date')}" />
			</h:outputFormat>
			
			<!-- Module partly expires -->
			<h:outputText rendered="#{cc.attrs.consent.getModulePartlyExpires(cc.attrs.moduleKey)}"
						  styleClass="m-0 white-space-nowrap tag tag_lightgreen round" value="#{msg['common.partlyExpires']}" />

			<!-- Module partly expired -->
			<h:outputText rendered="#{cc.attrs.consent.getModulePartlyExpired(cc.attrs.moduleKey)}"
						  styleClass="m-0 white-space-nowrap tag tag_lightred round" value="#{msg['common.partlyExpired']}" />
		</ui:fragment>
	</ui:fragment>

	<!-- Only Policy -->
	<ui:fragment rendered="#{cc.getValueExpression('policyKey') != null}">
		<!-- Policy expires at date in future (VALID) -->
		<h:outputFormat rendered="#{cc.attrs.consent.getPolicyExpires(cc.attrs.moduleKey, cc.attrs.policyKey) and not cc.attrs.consent.getPolicyExpired(cc.attrs.moduleKey, cc.attrs.policyKey)}"
						styleClass="m-0 white-space-nowrap tag tag_lightgreen round" value="#{msg['common.expires.on']}">
			<f:param value="#{consentController.dateToString(cc.attrs.consent.consentDates.policyExpirations.get(cc.attrs.moduleKey).get(cc.attrs.policyKey), 'date')}" />
		</h:outputFormat>

		<!-- Policy expired at date in past (INVALID) -->
		<h:outputFormat rendered="#{cc.attrs.consent.getPolicyExpired(cc.attrs.moduleKey, cc.attrs.policyKey)}"
						styleClass="m-0 white-space-nowrap tag tag_lightred round" value="#{msg['common.expired.on']}">
			<f:param value="#{consentController.dateToString(cc.attrs.consent.consentDates.policyExpirations.get(cc.attrs.moduleKey).get(cc.attrs.policyKey), 'date')}" />
		</h:outputFormat>
	</ui:fragment>

</composite:implementation>

</html>
