<html xmlns:h="http://java.sun.com/jsf/html" xmlns:ui="http://java.sun.com/jsf/facelets"
	  xmlns:p="http://primefaces.org/ui" xmlns:cc="http://java.sun.com/jsf/composite">

<!-- INTERFACE -->
<cc:interface>
	<cc:attribute name="alwaysVisible" type="java.lang.Boolean" required="false" default="false" />
	<cc:attribute name="checkboxLabel" type="java.lang.Boolean" required="false" default="true" />
	<cc:attribute name="disabled" type="java.lang.Boolean" required="false" default="false" />
	<cc:attribute name="disabledPeriod" type="java.lang.Boolean" required="false" default="false" />
	<cc:attribute name="disabledExpression" type="java.lang.Boolean" required="false" default="false" />
	<cc:attribute name="info" type="java.lang.String" required="false" default="" />
	<cc:attribute name="integrated" type="java.lang.Boolean" required="false" default="false" />
	<cc:attribute name="timeProperty" type="org.emau.icmvc.ganimed.ttp.cm2.frontend.controller.component.TimePropertyValue" required="true" />
	<cc:attribute name="ontoggle" type="java.lang.String" required="false" default="" />
	<cc:attribute name="mindate" type="java.time.LocalDate" shortDescription="First allowed date of the expiration." />
	<cc:attribute name="maxdate" type="java.time.LocalDate" shortDescription="Last allowed date of the expiration." />
	<cc:attribute name="isValidFromProperty" type="java.lang.Boolean" shortDescription="True if this is a validFrom property, false if its an expirationProperty. Just used for spelling in labels."
				  required="false" default="false" />
	<cc:attribute name="allowExpirationExpression" type="java.lang.Boolean" shortDescription="True if expiration expressions are allowed. Currently only for assignedPolicies"
				  required="false" default="false" />
</cc:interface>

<!-- IMPLEMENTATION -->
<cc:implementation>
	<h:panelGroup id="expiration" layout="block" style="margin-bottom: 10px;">
		<p:panelGrid columns="#{cc.attrs.integrated ? 2 : 1}" columnClasses="#{cc.attrs.integrated ? 'ui-grid-col-6,ui-grid-col-6' : 'ui-grid-col-12'}" layout="grid">
			<h:outputText value="#{cc.attrs.info} " />
			<h:panelGroup>
				<p:selectBooleanCheckbox disabled="#{cc.attrs.disabled}" value="#{cc.attrs.timeProperty.set}">
					<p:ajax oncomplete="#{cc.attrs.ontoggle}" process="@this" update="expiration" />
				</p:selectBooleanCheckbox>
				<h:outputText rendered="#{cc.attrs.checkboxLabel}" value="#{msg['template.expirationProperties.'.concat(cc.attrs.timeProperty.set)]}" />
			</h:panelGroup>
		</p:panelGrid>

		<ui:fragment rendered="#{cc.attrs.timeProperty.set or cc.attrs.alwaysVisible}">
			<p:panelGrid columns="#{cc.attrs.integrated ? 2 : 1}" columnClasses="#{cc.attrs.integrated ? 'ui-grid-col-6,ui-grid-col-6' : 'ui-grid-col-12'}" layout="grid" styleClass="top">
				<h:outputText value="#{cc.attrs.isValidFromProperty ? msg['model.consent.validFrom.TIMESTAMP'] : msg['model.consent.expiration.TIMESTAMP']}" />
				<h:panelGroup styleClass="ui-inputgroup" layout="block">
					<p:datePicker id="expirationDate" disabled="#{cc.attrs.disabled or !cc.attrs.timeProperty.set}"
								  pattern="#{cmsg['ui.date.pattern.date']}"
								  value="#{cc.attrs.timeProperty.timestamp}"
								  mask="#{cmsg['ui.date.mask.date']}"
								  mindate="#{cc.attrs.mindate}"
								  maxdate="#{cc.attrs.maxdate}"
								  placeholder="#{cmsg['ui.date.pattern.date']}" />
					<p:commandButton actionListener="#{cc.attrs.timeProperty.setTimestamp(null)}" disabled="#{cc.attrs.disabled or !cc.attrs.timeProperty.set}" icon="mdi mdi-eraser" process="@this"
									 styleClass="secondary" update="expirationDate" />
				</h:panelGroup>

				<h:outputText value="#{cc.attrs.isValidFromProperty ? msg['model.consent.validFrom.PERIOD'] : msg['model.consent.expiration.PERIOD']}" />
				<h:panelGroup layout="block"
							  style="border: 1px solid #d9e3e8; width: fit-content; padding: 13px 10px 0px 17px;    border-radius: 2px;">

					<p:panelGrid columns="2" columnClasses="ui-grid-col-4,ui-grid-col-8" layout="grid" styleClass="top">
						<p:outputLabel for="expirationPeriodYears" value="#{cmsg['ui.date.period.'.concat(cc.attrs.timeProperty.periodYears == 1 ? 'YEAR' : 'YEARS')]}" />
						<p:panelGrid columns="1" layout="grid">
							<p:inputText id="expirationPeriodYears" disabled="#{cc.attrs.disabled or cc.attrs.disabledPeriod or !cc.attrs.timeProperty.set}"
										 value="#{cc.attrs.timeProperty.periodYears}" />
							<p:slider disabled="#{cc.attrs.disabled or cc.attrs.disabledPeriod or !cc.attrs.timeProperty.set}" for="expirationPeriodYears" maxValue="150" minValue="0" />
						</p:panelGrid>
					</p:panelGrid>

					<p:panelGrid columns="2" columnClasses="ui-grid-col-4,ui-grid-col-8" layout="grid" styleClass="top">
						<p:outputLabel for="expirationPeriodMonths" value="#{cmsg['ui.date.period.'.concat(cc.attrs.timeProperty.periodMonths == 1 ? 'MONTH' : 'MONTHS')]}" />
						<p:panelGrid columns="1" layout="grid">
							<p:inputText id="expirationPeriodMonths" disabled="#{cc.attrs.disabled or cc.attrs.disabledPeriod or !cc.attrs.timeProperty.set}"
										 value="#{cc.attrs.timeProperty.periodMonths}" />
							<p:slider disabled="#{cc.attrs.disabled or cc.attrs.disabledPeriod or !cc.attrs.timeProperty.set}" for="expirationPeriodMonths" maxValue="11" minValue="0"
									  widgetVar="monthSlider" />
						</p:panelGrid>
					</p:panelGrid>

					<p:panelGrid columns="2" columnClasses="ui-grid-col-4,ui-grid-col-8" layout="grid" styleClass="top">
						<p:outputLabel for="expirationPeriodDays" value="#{cmsg['ui.date.period.'.concat(cc.attrs.timeProperty.periodDays == 1 ? 'DAY' : 'DAYS')]}" />
						<p:panelGrid columns="1" layout="grid">
							<p:inputText id="expirationPeriodDays" disabled="#{cc.attrs.disabled or cc.attrs.disabledPeriod or !cc.attrs.timeProperty.set}"
										 value="#{cc.attrs.timeProperty.periodDays}" />
							<p:slider disabled="#{cc.attrs.disabled or cc.attrs.disabledPeriod or !cc.attrs.timeProperty.set}" for="expirationPeriodDays" maxValue="30" minValue="0" />
						</p:panelGrid>
					</p:panelGrid>
				</h:panelGroup>

				<h:outputText rendered="#{cc.attrs.allowExpirationExpression}" value="#{msg['model.consent.expiration.EXPRESSION']}" />
				<h:panelGroup layout="block" rendered="#{cc.attrs.allowExpirationExpression}">
					<p:inputTextarea disabled="#{cc.attrs.disabled or cc.attrs.disabledExpression or !cc.attrs.timeProperty.set}"
									 value="#{cc.attrs.timeProperty.expression}"
									 maxlength="255" counter="expression_counter" counterTemplate="#{cmsg['ui.text.charsRemaining']}" />
					<h:outputText id="expression_counter" styleClass="textCounter" />
				</h:panelGroup>
			</p:panelGrid>
		</ui:fragment>
	</h:panelGroup>
</cc:implementation>

</html>
