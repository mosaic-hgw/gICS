<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:composite="http://java.sun.com/jsf/composite"
	  xmlns:components="http://java.sun.com/jsf/composite/components"
	  xmlns:f="http://java.sun.com/jsf/core"
	  xmlns:h="http://java.sun.com/jsf/html"
	  xmlns:p="http://primefaces.org/ui"
	  xmlns:ui="http://java.sun.com/jsf/facelets">

<!-- INTERFACE -->
<composite:interface>
	<composite:attribute name="update" type="java.lang.String" required="false" default="" />
	<composite:attribute name="onSubmitFunction" type="java.lang.String" required="false" default="" />
</composite:interface>

<!-- IMPLEMENTATION -->
<composite:implementation>
	<h:form id="form">
		<p:tabView id="tabs" widgetVar="tabs" rendered="#{domainController.pageMode != 'READ'}">
			<p:tab id="settings">
				<f:facet name="title">
					<i class="mdi mdi-cog" style="position: absolute;top: 3px;left: 10px"></i>
					<h:outputText value="#{msg['page.domains.settings']}" style="margin-left: 25px" />
				</f:facet>
				<p:focus context="tabs" />
				<p:panel>
					<h4>
						<h:outputText value="#{msg['page.domains.settings.common']}" />
					</h4>
					<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid" styleClass="top">
						<!-- Label -->
						<p:outputLabel for="label" value="#{msg['model.domain.label']}" />
						<p:inputText id="label" required="true" value="#{domainController.selectedDomain.label}" />

						<!-- Name -->
						<p:outputLabel for="name" value="#{msg['model.domain.name']}" />
						<p:inputText id="name" disabled="#{domainController.pageMode == 'EDIT'}"
									 value="#{domainController.selectedDomain.name}" />

						<!-- Comment -->
						<p:outputLabel for="comment" value="#{msg['model.domain.comment']}" />
						<p:inputTextarea id="comment" counter="comment_counter" counterTemplate="#{cmsg['ui.text.charsRemaining']}" maxlength="255"
										 rows="3" value="#{domainController.selectedDomain.comment}" />
						<p:column />
						<h:outputText id="comment_counter" styleClass="textCounter" />

						<!-- Signer Ids -->
						<p:outputLabel for="signerIdTypes" value="#{msg['page.domains.signerIds']} *" styleClass="font-bold" />
						<h:panelGroup id="signerIdTypes" layout="block">
							<p:dataTable id="signerIdTypesTable" styleClass="no-header" rowIndexVar="_rowIndex" draggableRows="#{!domainController.selectedDomain.finalised}"
										 rendered="#{not empty domainController.selectedDomain.signerIdTypes}"
										 style="width: 230px;"
										 value="#{domainController.selectedDomain.signerIdTypes}" var="_signerIdType" varStatus="_var" widgetVar="_table">
								<p:column>
									<h:outputText value="#{_signerIdType}" />
								</p:column>
								<p:column styleClass="icons" rendered="#{!domainController.selectedDomain.finalised}">
									<p:commandButton actionListener="#{domainController.removeSignerIdType(_rowIndex)}" icon="mdi mdi-minus" process="@form:tabs:signerIdTypes"
													 styleClass="secondary" update="@form:tabs:signerIdTypes" />
								</p:column>
							</p:dataTable>

							<h:panelGroup id="newSignerIdType" layout="block"
										  rendered="#{!domainController.selectedDomain.finalised}">
								<p:inputText style="width: 172px;" value="#{domainController.newSignerIdType}" />
								<p:commandButton id="addSignerId" actionListener="#{domainController.onNewSignerIdType}" icon="mdi mdi-plus"
												 process="newSignerIdType" styleClass="secondary" style="margin-left: 5px;"
												 update="signerIdTypes" title="#{msg['page.domains.signerIds.add']}" />
							</h:panelGroup>
						</h:panelGroup>
					</p:panelGrid>

					<h4>
						<h:outputText value="#{msg['page.domains.settings.revocation']}" />
					</h4>
					<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid">
						<!-- Revoke is permanent -->
						<h:panelGroup layout="block">
							<p:outputLabel value="#{msg['page.domains.misc.revokeIsPermanent']}" />
							<components:tooltip value="#{msg['page.domains.misc.revokeIsPermanent.hint']}" />
						</h:panelGroup>
						<p:selectBooleanCheckbox disabled="#{domainController.selectedDomain.finalised}"
												 value="#{domainController.revokeIsPermanent}" />
					</p:panelGrid>

					<!-- Statistic -->
					<h4>
						<h:outputText value="#{msg['page.domains.statistic']}" />
					</h4>
					<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid">

						<!-- Calculate document details -->
						<h:panelGroup layout="block">
							<p:outputLabel value="#{msg['page.domains.statistic.document_details']}" />
							<components:tooltip value="#{msg['page.domains.statistic.document_details.hint']}" />
						</h:panelGroup>
						<p:selectBooleanCheckbox value="#{domainController.statisticDocumentDetails}" />

						<!-- Calculate policy details -->
						<h:panelGroup layout="block">
							<p:outputLabel value="#{msg['page.domains.statistic.policy_details']}" />
							<components:tooltip value="#{msg['page.domains.statistic.policy_details.hint']}" />
						</h:panelGroup>
						<p:selectBooleanCheckbox value="#{domainController.statisticPolicyDetails}" />
					</p:panelGrid>

					<!-- PDF Export -->
					<h4>
						<h:outputText value="#{msg['page.domains.pdfExport']}" />
					</h4>
					<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid" styleClass="mb-0">
						<!-- Chrome PDF Export -->
						<h:panelGroup layout="block">
							<p:outputLabel value="#{msg['page.domains.pdfExport.enableChromePdfExport']}" />
							<components:tooltip hideOnHover="false" value="#{msg['page.domains.pdfExport.chromedriverPath.hint']}" />
						</h:panelGroup>
						<p:selectBooleanCheckbox value="#{domainController.enableChromePdfExport}">
							<p:ajax process="@this" partialSubmit="true" update="chromedriverPathGroup" />
						</p:selectBooleanCheckbox>
					</p:panelGrid>

					<h:panelGroup layout="block" id="chromedriverPathGroup">
						<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid" rendered="#{domainController.enableChromePdfExport}">

							<!-- Chromedriver Path -->
							<p:outputLabel for="chromedriverPath" value="#{msg['page.domains.pdfExport.chromedriverPath']}" />

							<h:panelGroup styleClass="ui-inputgroup w-full" layout="block">
								<p:inputText id="chromedriverPath" value="#{domainController.chromedriverPath}" styleClass="w-full" />
								<p:commandButton ajax="false" icon="mdi mdi-flask-outline" styleClass="white-space-nowrap min-w-min ui-inputgroup-addon"
												 value="#{msg['page.domains.pdfExport.chromedriverPath.test']}">
									<p:fileDownload value="#{domainController.testChromePDF}" />
								</p:commandButton>
							</h:panelGroup>
						</p:panelGrid>
					</h:panelGroup>

					<!-- Embedding -->
					<h4>
						<h:outputText value="#{msg['page.domains.embedding']}" />
					</h4>
					<!-- css -->
					<p:outputLabel for="embedding_css" value="#{msg['page.domains.embedding.css']}" />
					<components:tooltip hideOnHover="false" value="#{msg['page.domains.embedding.css.hint']}" />
					<p:inputTextarea id="embedding_css" styleClass="w-full"
									 rows="5" value="#{domainController.embeddedCss}" />
				</p:panel>
			</p:tab>

			<p:tab id="documents">
				<f:facet name="title">
					<i class="mdi mdi-file-multiple-outline" style="position: absolute;top: 3px;left: 10px"></i>
					<h:outputText value="#{msg['page.domains.documents']}" style="margin-left: 25px" />
				</f:facet>
				<p:panel>
					<!-- Template Types -->
					<h4>
						<h:outputText value="#{msg['page.domains.documents.templateTypes']}" />
					</h4>

					<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid">
						<h:panelGroup layout="block">
							<p:outputLabel value="#{msg['page.domains.documents.templateTypes.web']}" />
							<components:tooltip value="#{msg['page.domains.documents.templateTypes.web.hint']}" />
						</h:panelGroup>
						<p:selectManyCheckbox value="#{domainController.selectedDomain.config.applicationConfig.templateTypes}" layout="responsive"
											  columns="2">
							<f:selectItems value="#{domainController.availableTemplateTypes}" var="_type" itemLabel="#{msg['template.type.plural.detailed.'.concat(_type.name())]}" />
						</p:selectManyCheckbox>
					</p:panelGrid>

					<!-- Versioning -->
					<h4>
						<h:outputText value="#{msg['page.domains.versionLevel']}" />
						<components:tooltip value="#{msg['page.domains.versionLevel.hint']}" />
					</h4>

					<h:panelGroup id="versionLevelSimple" layout="block"
								  rendered="#{!domainController.selectedDomain.finalised}">
						<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid" rendered="#{!domainController.versionLevelDetailed}">

							<!-- General versionLevel -->
							<h:panelGroup layout="block">
								<p:outputLabel value="#{msg['page.domains.versionLevel.general']}" />
								<components:tooltip value="#{msg['page.domains.misc.useLatestVersion.hint']}" />
							</h:panelGroup>
							<p:selectOneMenu value="#{domainController.selectedDomain.ctVersionConverter}" disabled="#{domainController.selectedDomain.finalised}">
								<f:selectItems value="#{Versions.versionMap.keySet()}" var="_version"
											   itemLabel="#{msg['domain.versionLevel.'.concat(Versions.label(_version))]}" />
							</p:selectOneMenu>

							<p:commandButton id="enableVersionLevelDetailed" actionListener="#{domainController.setVersionLevelDetailed(true)}" icon="mdi mdi-menu-down"
											 process="@this" styleClass="secondary" update="versionLevelSimple, versionLevelDetailed"
											 value="#{msg['page.domains.versionLevel.detailed']}" />
						</p:panelGrid>
					</h:panelGroup>

					<h:panelGroup id="versionLevelDetailed" layout="block">
						<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid"
									 rendered="#{domainController.versionLevelDetailed or domainController.selectedDomain.finalised}">

							<!-- Template versionLevel -->
							<p:outputLabel value="#{msg['template.templates']}" />
							<p:selectOneMenu disabled="#{domainController.selectedDomain.finalised}"
											 value="#{domainController.selectedDomain.ctVersionConverter}">
								<f:selectItems value="#{Versions.versionMap.keySet()}" var="_version"
											   itemLabel="#{msg['domain.versionLevel.'.concat(Versions.label(_version))]}" />
							</p:selectOneMenu>

							<!-- Module versionLevel -->
							<p:outputLabel value="#{msg['module.modules']}" />
							<p:selectOneMenu disabled="#{domainController.selectedDomain.finalised}"
											 value="#{domainController.selectedDomain.moduleVersionConverter}">
								<f:selectItems value="#{Versions.versionMap.keySet()}" var="_version"
											   itemLabel="#{msg['domain.versionLevel.'.concat(Versions.label(_version))]}" />
							</p:selectOneMenu>

							<!-- Policy versionLevel -->
							<p:outputLabel value="#{msg['policy.policies']}" />
							<p:selectOneMenu disabled="#{domainController.selectedDomain.finalised}"
											 value="#{domainController.selectedDomain.policyVersionConverter}">
								<f:selectItems value="#{Versions.versionMap.keySet()}" var="_version"
											   itemLabel="#{msg['domain.versionLevel.'.concat(Versions.label(_version))]}" />
							</p:selectOneMenu>

							<p:commandButton id="enableVersionLevelSimple" actionListener="#{domainController.setVersionLevelDetailed(false)}" icon="mdi mdi-menu-up"
											 process="@this" rendered="#{!domainController.selectedDomain.finalised}" styleClass="secondary"
											 update="versionLevelSimple, versionLevelDetailed" value="#{msg['page.domains.versionLevel.simple']}" />
						</p:panelGrid>
					</h:panelGroup>

					<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid">
						<!-- Use latest version -->
						<p:outputLabel value="#{msg['page.domains.misc.useLatestVersion']}" />
						<p:selectBooleanCheckbox disabled="#{domainController.selectedDomain.finalised}"
												 value="#{domainController.useLatestVersion}" />
					</p:panelGrid>

					<!-- Scans -->
					<h4>
						<h:outputText value="#{msg['page.domains.settings.scans']}" />
					</h4>
					<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid">
						<!-- Scan is mandatory -->
						<p:outputLabel value="#{msg['page.domains.scans.mandatory']}" />
						<p:selectBooleanCheckbox value="#{domainController.scanMandatory}" />

						<!-- Scan size limit -->
						<p:outputLabel value="#{msg['page.domains.scans.sizeLimit']}" />
						<p:spinner min="1" suffix=" MB"
								   value="#{domainController.scanSizeLimit}" />
					</p:panelGrid>
				</p:panel>
			</p:tab>

			<p:tab id="expiration">
				<f:facet name="title">
					<i class="mdi mdi-progress-clock" style="position: absolute;top: 3px;left: 10px"></i>
					<h:outputText value="#{msg['page.domains.expiration']}" style="margin-left: 25px" />
				</f:facet>
				<p:panel>
					<!-- Expiration Properties -->
					<components:time_property alwaysVisible="true" checkboxLabel="false"
											  disabled="#{domainController.selectedDomain.finalised and domainController.fixedExpirationDateIsExceeded(domainController.selectedDomain.expirationProperties)}"
											  disabledPeriod="#{domainController.selectedDomain.finalised}"
											  info="#{msg['model.domain.expirationProperties']}" integrated="true"
											  timeProperty="#{domainController.expiration.editTimeProperty}"
											  mindate="#{domainController.selectedDomain.finalised ? domainController.tomorrow : null}" />
				</p:panel>
			</p:tab>

			<p:tab id="qualityControl">
				<f:facet name="title">
					<i class="mdi mdi-check-decagram" style="position: absolute;top: 3px;left: 10px"></i>
					<h:outputText value="#{msg['page.domains.qualityControl']}" style="margin-left: 25px" />
				</f:facet>
				<p:panel>
					<!-- QC Types -->
					<h4>
						<h:outputText value="#{msg['model.qc.types']}" />
					</h4>
					<p:dataTable id="qcTypes" value="#{domainController.qcTypes}"
								 var="_type">
						<p:column styleClass="icons">
							<p:commandButton actionListener="#{domainController.onSetDefaultQcType(_type)}"
											 icon="mdi mdi-star#{domainController.qcConfig.defaultType.id == _type.id ? '' : '-outline'}"
											 process="@this"
											 rendered="#{_type.id != 'invalidated'}"
											 styleClass="secondary"
											 title="#{msg['page.qc.type.setDefault']}"
											 update="qcTypes" />
						</p:column>
						<p:column headerText="#{msg['model.qc.type.label']}" sortBy="#{_type.getLabel(commonLanguageBean.language)}" sortOrder="asc">
							<h:outputText value="#{_type.getLabel(commonLanguageBean.language)}" />
						</p:column>
						<p:column headerText="#{msg['model.qc.type.value']}">
							<h:outputText value="#{_type.id}" />
						</p:column>
						<p:column headerText="#{msg['model.qc.type.status']}">
							<h:outputText value="#{msg['model.qc.type.status.'.concat(_type.status.name())]}" styleClass="tag tag_#{_type.status.name() == 'VALID' ? 'lightgreen' : 'lightred'}" />
						</p:column>
						<p:column styleClass="icons">
							<p:commandButton actionListener="#{domainController.onEditQcType(_type)}"
											 icon="mdi mdi-pencil"
											 oncomplete="PF('qcType_dialog').show();"
											 process="@this"
											 rendered="#{_type.id != 'invalidated'}"
											 styleClass="secondary"
											 title="#{cmsg['ui.button.edit']}"
											 update="#{cc.attrs.id}:qcType_dialog" />
							<p:commandButton actionListener="#{domainController.onRemoveQcType(_type)}"
											 disabled="#{domainController.selectedDomain.finalised and domainController.qcConfig.types.contains(_type)}"
											 icon="mdi mdi-delete-empty"
											 process="@this"
											 rendered="#{_type.id != 'invalidated'}"
											 styleClass="secondary"
											 title="#{cmsg['ui.button.remove']}"
											 update="qcTypes" />
						</p:column>
					</p:dataTable>
					<p:commandButton actionListener="#{domainController.onNewQcType}"
									 icon="mdi mdi-plus"
									 oncomplete="PF('qcType_dialog').show();"
									 process="@this"
									 style="margin-bottom: 10px;"
									 styleClass="secondary"
									 update="#{cc.attrs.id}:qcType_dialog"
									 value="#{msg['page.domains.qualityControl.qcType.new']}" />

					<!-- QC Problems -->
					<h4 style="margin-top: 25px;">
						<h:outputText value="#{msg['model.qc.problem.types']}" />
					</h4>
					<p:dataTable id="qcProblemTypes" value="#{domainController.qcProblemTypes}"
								 var="_problemType">
						<p:column headerText="#{msg['model.qc.problem.type.label']}" sortBy="#{_problemType.getLabel(commonLanguageBean.language)}" sortOrder="asc">
							<h:outputText value="#{_problemType.getLabel(commonLanguageBean.language)}" />
						</p:column>
						<p:column headerText="#{msg['model.qc.problem.type.id']}">
							<h:outputText value="#{_problemType.id}" />
						</p:column>
						<p:column headerText="#{msg['model.qc.problem.type.field']}">
							<h:outputText value="#{msg['model.qc.problem.type.field.'.concat(_problemType.field.name())]}" />
						</p:column>
						<p:column headerText="#{msg['model.qc.problem.type.error']}">
							<h:outputText value="#{msg['model.qc.problem.type.error.'.concat(_problemType.error.name())]}" />
						</p:column>
						<p:column headerText="#{msg['model.qc.problem.type.occurrence']}">
							<h:outputText value="#{msg['model.qc.problem.type.occurrence.'.concat(_problemType.occurrence.name())]}" />
						</p:column>
						<p:column headerText="#{msg['model.qc.problem.type.action']}">
							<h:outputText value="#{_problemType.action.getLabelOrId(commonLanguageBean.language)}" />
						</p:column>
						<p:column styleClass="icons">
							<p:commandButton actionListener="#{domainController.onEditQcProblemType(_problemType)}"
											 icon="mdi mdi-pencil"
											 oncomplete="PF('qcProblemType_dialog').show();"
											 process="@this"
											 styleClass="secondary"
											 title="#{cmsg['ui.button.edit']}"
											 update="#{cc.attrs.id}:qcProblemType_dialog" />
							<p:commandButton actionListener="#{domainController.onRemoveQcProblemType(_problemType)}"
											 disabled="#{domainController.selectedDomain.finalised and domainController.qcConfig.problemTypes.contains(_problemType)}"
											 icon="mdi mdi-delete-empty"
											 process="@this"
											 styleClass="secondary"
											 title="#{cmsg['ui.button.remove']}"
											 update="qcProblemTypes" />
						</p:column>
					</p:dataTable>
					<p:commandButton actionListener="#{domainController.onNewQcProblemType}"
									 icon="mdi mdi-plus"
									 oncomplete="PF('qcProblemType_dialog').show();"
									 process="@this"
									 style="margin-bottom: 10px;"
									 styleClass="secondary"
									 update="#{cc.attrs.id}:qcProblemType_dialog"
									 value="#{msg['page.domains.qualityControl.qcProblemType.new']}" />

					<!-- QC Actions -->
					<h4 style="margin-top: 25px;">
						<h:outputText value="#{msg['model.qc.problem.type.actions']}" />
					</h4>
					<p:dataTable id="qcActions" value="#{domainController.qcProblemTypeActions}"
								 var="_action">
						<p:column headerText="#{msg['model.qc.problem.type.action.label']}" sortBy="#{_action.getLabel(commonLanguageBean.language)}" sortOrder="asc">
							<h:outputText value="#{_action.getLabel(commonLanguageBean.language)}" />
						</p:column>
						<p:column headerText="#{msg['model.qc.problem.type.action.id']}">
							<h:outputText value="#{_action.id}" />
						</p:column>
						<p:column styleClass="icons">
							<p:commandButton actionListener="#{domainController.onEditQcAction(_action)}"
											 icon="mdi mdi-pencil"
											 oncomplete="PF('qcAction_dialog').show();"
											 process="@this"
											 styleClass="secondary"
											 title="#{cmsg['ui.button.edit']}"
											 update="#{cc.attrs.id}:qcAction_dialog" />
							<p:commandButton actionListener="#{domainController.onRemoveQcAction(_action)}"
											 disabled="#{domainController.selectedDomain.finalised and domainController.qcConfig.problemTypeActions.contains(_action)}"
											 icon="mdi mdi-delete-empty"
											 process="@this"
											 styleClass="secondary"
											 title="#{cmsg['ui.button.remove']}"
											 update="qcActions" />
						</p:column>
					</p:dataTable>
					<p:commandButton actionListener="#{domainController.onNewQcAction}"
									 icon="mdi mdi-plus"
									 oncomplete="PF('qcAction_dialog').show();"
									 process="@this"
									 style="margin-bottom: 10px;"
									 styleClass="secondary"
									 update="#{cc.attrs.id}:qcAction_dialog"
									 value="#{msg['page.domains.qualityControl.qcAction.new']}" />
				</p:panel>
			</p:tab>

			<p:tab id="logo">
				<f:facet name="title">
					<i class="mdi mdi-image-filter-hdr" style="position: absolute;top: 3px;left: 10px"></i>
					<h:outputText value="#{msg['page.domains.logo']}" style="margin-left: 25px" />
				</f:facet>
				<p:panel id="logoPanel">
					<!-- Logo -->
					<h4>
						<h:outputText value="#{msg['page.domains.logo']}" />
					</h4>
					<p:fileUpload allowTypes="/(\.|\/)(png|jpg|jpeg|PNG|JPG|JPEG)$/" auto="true" cancelLabel="#{cmsg['ui.file.cancel']}"
								  listener="#{domainController.onUploadLogo}" invalidFileMessage="#{cmsg['ui.file.format.notPNG']}" label="#{cmsg['ui.file.choose']}"
								  multiple="false" process="@this" rendered="#{empty domainController.selectedDomain.logo}"
								  update="logoPanel" uploadLabel="#{cmsg['ui.file.upload']}">
					</p:fileUpload>

					<p:graphicImage cache="false" rendered="#{not empty domainController.selectedDomain.logo}" stream="false"
									value="#{domainController.getImageStreamFromBase64(domainController.selectedDomain.logo, 'png', 'logo')}"
									style="max-width: 600px; max-height: 100px;;" />
					<br />
					<p:commandButton actionListener="#{domainController.onDeleteLogo()}" icon="mdi mdi-delete-empty" process="@this"
									 rendered="#{not empty domainController.selectedDomain.logo}" styleClass="secondary" update="logoPanel"
									 value="#{cmsg['ui.button.remove']}">
					</p:commandButton>
				</p:panel>
			</p:tab>

			<p:tab id="extern">
				<f:facet name="title">
					<i class="mdi mdi-server-network" style="position: absolute;top: 3px;left: 10px"></i>
					<h:outputText value="#{msg['page.domains.extern']}" style="margin-left: 25px" />
				</f:facet>
				<p:panel>
					<p:panelGrid columnClasses="ui-grid-col-6,ui-grid-col-6" columns="2" layout="grid">
						<!-- Use notification service -->
						<h:panelGroup layout="block">
							<p:outputLabel value="#{msg['page.domains.misc.sendNotificationsWeb']}" />
							<components:tooltip value="#{msg['page.domains.misc.sendNotificationsWeb.hint']}" />
						</h:panelGroup>
						<p:selectBooleanCheckbox value="#{domainController.sendNotificationsWeb}" />

						<!-- Check for changed policies -->
						<h:panelGroup layout="block">
							<p:outputLabel value="#{msg['page.domains.misc.sendNotificationsOnPolicyChanged']}" />
							<components:tooltip value="#{msg['page.domains.misc.sendNotificationsOnPolicyChanged.hint']}" />
						</h:panelGroup>
						<h:panelGroup id="sendNotificationsOnPolicyChanged">
							<p:selectBooleanCheckbox value="#{domainController.sendNotificationsOnPolicyValidityChanged}">
								<p:ajax process="@this" partialSubmit="true" update="sendNotificationsOnPolicyChanged" />
							</p:selectBooleanCheckbox>
							<h:outputText value="#{msg['page.domains.misc.sendNotificationsOnPolicyChanged.never']}"
										  rendered="#{!domainController.sendNotificationsOnPolicyValidityChanged}"
										  styleClass="text-sm opacity-80" />
							<ui:fragment rendered="#{domainController.sendNotificationsOnPolicyValidityChanged}">
								<h:outputFormat value="#{msg['page.domains.misc.sendNotificationsOnPolicyChanged.interval']}"
												rendered="#{!domainController.checkChangedPoliciesPeriodIsDaily}"
												styleClass="text-sm opacity-80">
									<f:param value="#{domainController.checkChangedPoliciesPeriod}" />
									<f:param value="#{domainController.checkChangedPoliciesStartTime}" />
								</h:outputFormat>
								<h:outputFormat value="#{msg['page.domains.misc.sendNotificationsOnPolicyChanged.intervalDaily']}"
												rendered="#{domainController.checkChangedPoliciesPeriodIsDaily}"
												styleClass="text-sm opacity-80">
									<f:param value="#{domainController.checkChangedPoliciesStartTime}" />
								</h:outputFormat>
							</ui:fragment>
						</h:panelGroup>

						<!-- External properties -->
						<p:outputLabel for="extern_properties" value="#{msg['model.domain.externProperties']}" />
						<p:inputTextarea id="extern_properties" counter="extern_properties_counter" counterTemplate="#{cmsg['ui.text.charsRemaining']}"
										 maxlength="4095" rows="3" value="#{domainController.selectedDomain.externProperties}" />
						<p:column />
						<h:outputText id="extern_properties_counter" styleClass="textCounter" />
					</p:panelGrid>
				</p:panel>
			</p:tab>
		</p:tabView>

		<p:panel rendered="#{domainController.pageMode != 'READ'}" style="margin-top: 15px;">
			<p:commandButton actionListener="#{domainController.onSave}"
							 icon="mdi mdi-check"
							 oncomplete="if (args &amp;&amp; args.validationFailed) PF('tabs').select(0); #{cc.attrs.onSubmitFunction}"
							 update="#{cc.attrs.update}, @form"
							 value="#{cmsg['ui.button.save.'.concat(domainController.pageMode)]}" />

			<p:commandButton id="cancel" actionListener="#{domainController.onCancel}"
							 icon="mdi mdi-close" styleClass="secondary"
							 ignoreAutoUpdate="#{cc.attrs.dialog}"
							 onclick="#{cc.attrs.onCancelFunction}"
							 process="@this" update="#{cc.attrs.update}, @form"
							 value="#{cmsg['ui.button.cancel']}" />
		</p:panel>
	</h:form>

	<p:dialog id="qcType_dialog" blockScroll="true"
			  closeOnEscape="true" header="#{msg['model.qc.type']}"
			  modal="true" responsive="true" widgetVar="qcType_dialog" style="min-width: 500px">
		<h:form rendered="#{domainController.selectedQcType != null}">
			<p:messages />
			<p:panelGrid columnClasses="ui-grid-col-5,ui-grid-col-7" columns="2" layout="grid" styleClass="top">
				<!-- ID -->
				<p:outputLabel for="id" value="#{msg['model.qc.type.value']}" />
				<p:inputText id="id" disabled="#{!domainController.selectedQcTypeIsNew}" required="true" value="#{domainController.selectedQcType.id}" styleClass="w-full"
							 validatorMessage="#{cmsg['message.validation.invalidIdTag']}">
					<f:validateRegex pattern="#{domainController.selectedQcType.validIdPattern.toString()}" />
				</p:inputText>

				<!-- Label -->
				<p:outputLabel value="#{msg['model.qc.type.label']}" />
				<components:multi_language_input values="#{domainController.selectedQcType.labels}" styleClass="w-full" />

				<!-- Status -->
				<p:outputLabel for="status" value="#{msg['model.qc.type.status']}" />
				<p:selectOneMenu id="status"
								 disabled="#{!domainController.selectedQcTypeIsNew and domainController.selectedDomain.finalised and domainController.qcConfig.types.contains(domainController.selectedQcType)}"
								 value="#{domainController.selectedQcType.status}"
								 styleClass="w-full">
					<f:selectItems value="#{domainController.availableQcTypeStatus}" itemLabel="#{msg['model.qc.type.status.'.concat(_status.name())]}" var="_status" />
				</p:selectOneMenu>
			</p:panelGrid>

			<p:commandButton actionListener="#{domainController.onSaveQcType}"
							 icon="mdi mdi-check"
							 oncomplete="if (args &amp;&amp; !args.validationFailed) PF('qcType_dialog').hide();"
							 update="@form, #{cc.attrs.id}:form:tabs:qcTypes"
							 value="#{cmsg['ui.button.save']}" />
			<p:commandButton icon="mdi mdi-close" immediate="true" onclick="PF('qcType_dialog').hide();"
							 styleClass="secondary" value="#{cmsg['ui.button.cancel']}" />
		</h:form>
	</p:dialog>

	<p:dialog id="qcProblemType_dialog" blockScroll="true"
			  closeOnEscape="true" header="#{msg['model.qc.problem.type']}"
			  modal="true" responsive="true"
			  style="min-width: 500px"
			  widgetVar="qcProblemType_dialog">
		<h:form id="qcProblemType_form" rendered="#{domainController.selectedQcProblemType != null}">
			<p:messages />
			<p:panelGrid columnClasses="ui-grid-col-5,ui-grid-col-7" columns="2" layout="grid" styleClass="top">
				<!-- ID -->
				<p:outputLabel for="id" value="#{msg['model.qc.problem.type.id']}" />
				<p:inputText id="id" disabled="#{!domainController.selectedQcProblemTypeIsNew}" placeholder="#{domainController.selectedQcProblemTypeIdPlaceholder}"
							 value="#{domainController.selectedQcProblemType.id}" styleClass="w-full"
							 validatorMessage="#{cmsg['message.validation.invalidId']}">
					<f:validateRegex pattern="#{domainController.getValidIdPatternWithEmpty().toString()}" />
				</p:inputText>

				<!-- Label -->
				<p:outputLabel value="#{msg['model.qc.problem.type.label']}" />
				<components:multi_language_input id="label" values="#{domainController.selectedQcProblemType.labels}" styleClass="w-full"
												 placeholder="#{domainController.selectedQcProblemTypeLabelPlaceholder}" />

				<!-- Field -->
				<p:outputLabel for="field" value="#{msg['model.qc.problem.type.field']}" />
				<p:selectOneMenu id="field" required="true"
								 disabled="#{!domainController.selectedQcProblemTypeIsNew and domainController.selectedDomain.finalised and domainController.qcConfig.problemTypes.contains(domainController.selectedQcProblemType)}"
								 value="#{domainController.selectedQcProblemType.field}" styleClass="w-full">
					<p:ajax listener="#{domainController.onChangeProblemTypeValues}" process="id, label:labels, field, error" update="id, label:labels" />
					<f:selectItems value="#{domainController.availableQCProblemTypeFields}" itemLabel="#{msg['model.qc.problem.type.field.'.concat(_field.name())]}" var="_field" />
				</p:selectOneMenu>

				<!-- Error -->
				<p:outputLabel for="error" value="#{msg['model.qc.problem.type.error']}" />
				<p:selectOneMenu id="error" required="true"
								 disabled="#{!domainController.selectedQcProblemTypeIsNew and domainController.selectedDomain.finalised and domainController.qcConfig.problemTypes.contains(domainController.selectedQcProblemType)}"
								 value="#{domainController.selectedQcProblemType.error}" styleClass="w-full">
					<p:ajax listener="#{domainController.onChangeProblemTypeValues}" process="id, label:labels, field, error" update="id, label:labels" />
					<f:selectItems value="#{domainController.availableQCProblemTypeErrors}" itemLabel="#{msg['model.qc.problem.type.error.'.concat(_error.name())]}" var="_error" />
				</p:selectOneMenu>

				<!-- Occurrence -->
				<p:outputLabel for="occurrence" value="#{msg['model.qc.problem.type.occurrence']}" />
				<p:selectOneMenu id="occurrence" required="true"
								 disabled="#{!domainController.selectedQcProblemTypeIsNew and domainController.selectedDomain.finalised and domainController.qcConfig.problemTypes.contains(domainController.selectedQcProblemType)}"
								 value="#{domainController.selectedQcProblemType.occurrence}" styleClass="w-full">
					<f:selectItems value="#{domainController.availableQCProblemTypeOccurrences}" itemLabel="#{msg['model.qc.problem.type.occurrence.'.concat(_occurrence.name())]}" var="_occurrence" />
				</p:selectOneMenu>

				<!-- Action -->
				<p:outputLabel for="action" value="#{msg['model.qc.problem.type.action']}" />
				<h:panelGroup id="actionSelection">
					<p:selectOneMenu id="action" converter="genericConverter" required="true"
									 disabled="#{!domainController.selectedQcProblemTypeIsNew and domainController.selectedDomain.finalised and domainController.qcConfig.problemTypes.contains(domainController.selectedQcProblemType)}"
									 rendered="#{not empty domainController.qcProblemTypeActions}"
									 value="#{domainController.selectedQcProblemType.action}">
						<f:selectItem itemLabel="#{cmsg['ui.select.pleaseSelect']}" noSelectionOption="true" />
						<f:selectItems value="#{domainController.qcProblemTypeActions}" itemLabel="#{_action.getLabelOrId(commonLanguageBean.language)}" var="_action" />
					</p:selectOneMenu>
					<p:commandButton actionListener="#{domainController.onNewQcAction}"
									 rendered="#{!(!domainController.selectedQcProblemTypeIsNew and domainController.selectedDomain.finalised and domainController.qcConfig.problemTypes.contains(domainController.selectedQcProblemType))}"
									 icon="mdi mdi-plus"
									 oncomplete="PF('qcAction_dialog').show();"
									 process="@this"
									 styleClass="secondary m-0 mt-1"
									 update="#{cc.attrs.id}:qcAction_dialog"
									 value="#{msg['page.domains.qualityControl.qcAction.new']}" />
				</h:panelGroup>
			</p:panelGrid>

			<p:commandButton actionListener="#{domainController.onSaveQcProblemType}"
							 icon="mdi mdi-check"
							 oncomplete="if (args &amp;&amp; !args.validationFailed) PF('qcProblemType_dialog').hide();"
							 update="@form, #{cc.attrs.id}:form:tabs:qcProblemTypes"
							 value="#{cmsg['ui.button.save']}" />
			<p:commandButton icon="mdi mdi-close" immediate="true" onclick="PF('qcProblemType_dialog').hide();"
							 styleClass="secondary" value="#{cmsg['ui.button.cancel']}" />
		</h:form>
	</p:dialog>

	<p:dialog id="qcAction_dialog" blockScroll="true"
			  closeOnEscape="true" header="#{msg['model.qc.problem.type.action']}"
			  modal="true" responsive="true" widgetVar="qcAction_dialog" style="min-width: 500px">
		<h:form rendered="#{domainController.selectedQcProblemTypeAction != null}">
			<p:messages />
			<p:panelGrid columnClasses="ui-grid-col-5,ui-grid-col-7" columns="2" layout="grid">
				<!-- ID -->
				<p:outputLabel for="id" value="#{msg['model.qc.problem.type.action.id']}" />
				<p:inputText id="id" disabled="#{!domainController.selectedQcProblemTypeActionIsNew}" required="true" value="#{domainController.selectedQcProblemTypeAction.id}" styleClass="w-full"
							 validatorMessage="#{cmsg['message.validation.invalidId']}">
					<f:validateRegex pattern="#{domainController.selectedQcProblemTypeAction.validIdPattern.toString()}" />
				</p:inputText>

				<!-- Label -->
				<p:outputLabel value="#{msg['model.qc.problem.type.action.label']}" />
				<components:multi_language_input values="#{domainController.selectedQcProblemTypeAction.labels}" styleClass="w-full" />
			</p:panelGrid>

			<p:commandButton actionListener="#{domainController.onSaveQcAction}"
							 icon="mdi mdi-check"
							 oncomplete="if (args &amp;&amp; !args.validationFailed) PF('qcAction_dialog').hide();"
							 update="@form, #{cc.attrs.id}:form:tabs:qcActions, #{cc.attrs.id}:qcProblemType_form:actionSelection"
							 value="#{cmsg['ui.button.save']}" />
			<p:commandButton icon="mdi mdi-close" immediate="true" onclick="PF('qcAction_dialog').hide();"
							 styleClass="secondary" value="#{cmsg['ui.button.cancel']}" />
		</h:form>
	</p:dialog>
</composite:implementation>

</html>
