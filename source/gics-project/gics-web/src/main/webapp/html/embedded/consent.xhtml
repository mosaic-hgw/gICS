<html xmlns="http://www.w3.org/1999/xhtml" xmlns:components="http://java.sun.com/jsf/composite/components"
	  xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:p="http://primefaces.org/ui"
	  xmlns:ui="http://java.sun.com/jsf/facelets">

<body>
<ui:composition template="/resources/templates/gics_embed.xhtml">
	<ui:define name="css">
		<link href="#{request.contextPath}/html/public/assets/css/consents.css" rel="stylesheet" type="text/css" />
		<style type="text/css">
			#{embeddedController.selectedDomain.config.applicationConfig.embeddedCss}
		</style>
	</ui:define>

	<ui:define name="project_logo">
		<h:panelGroup layout="block" styleClass="gics-logo" rendered="#{!embeddedController.useDomainLogo}">
			<p:graphicImage value="/html/public/assets/images/gics-logo.png" />
		</h:panelGroup>
		<h:graphicImage value="#{domainSelector.selectedDomainLogo}" rendered="#{embeddedController.useDomainLogo and not empty domainSelector.selectedDomainLogo}" />
	</ui:define>

	<ui:define name="full_header_title">
		<h:outputText value="#{embeddedController.getTitle(consentController.editConsent.templateType)}" />
	</ui:define>

	<ui:define name="title">
		<h:outputText value="#{embeddedController.getTitle(consentController.editConsent.templateType)}" />
	</ui:define>

	<ui:define name="help">
		<f:event listener="#{helpBean.setHelpAvailable(not empty embeddedController.help)}" type="preRenderComponent" />
		<h:outputText value="#{embeddedController.help}" />
	</ui:define>

	<ui:define name="content">
		<h:form id="main" onkeypress="if (event.keyCode === 13) { return false; }">
			<p:focus context="@form" />

			<f:event listener="#{embeddedController.init}" type="preRenderView" />
			<f:event listener="#{consentController.init(empty param['print'] and empty param['pdf'])}" type="preRenderView" />

			<components:print autoClose="true" />
		</h:form>

		<h:panelGroup layout="block" id="new">
			<ui:fragment rendered="#{consentController.consentPageMode == 'NEW'}">
				<h:form>
					<p:panel styleClass="templateSelector" rendered="#{!embeddedController.prefilledTemplate}">
						<h4>
							<h:outputText value="#{msg['page.consents.chooseTemplate']}" />
						</h4>
						<p:selectOneMenu converter="genericConverter" filter="true" filterMatchMode="contains" required="true"
										 styleClass="max" value="#{consentController.editConsent.key.consentTemplateKey}">
							<p:ajax listener="#{consentController.onSelectTemplate()}" update="@form" />
							<f:selectItem itemDisabled="true" itemLabel="#{msg['common.pleaseSelect']}" noSelectionOption="true" />
							<f:selectItems itemLabel="#{_template.label} V #{_template.versionLabelAndVersion} #{!_template.finalised ? '*'.concat(msg['common.notFinalised']).concat('*') : ''}"
										   itemValue="#{_template.key}"
										   value="#{consentController.templates}"
										   var="_template" />
						</p:selectOneMenu>
					</p:panel>
					<components:consent_form consent="#{consentController.editConsent}"
											 consentController="#{consentController}"
											 digitalSignature="#{embeddedController.digitalSignature}"
											 editable="#{embeddedController.editable}"
											 scanUpload="#{embeddedController.scanUpload}"
											 rendered="#{not empty consentController.editConsent.template}" />

					<p:panel style="margin-top: 15px;" styleClass="formNavigation">
						<p:commandButton actionListener="#{consentController.onSaveConsent}" disabled="#{!consentController.editConsent.template.finalised}" icon="mdi mdi-check"
										 onclick="PF('loading').show();"
										 oncomplete="PF('loading').hide();if (args &amp;&amp; args.validationFailed) window.scrollTo(0, 0); "
										 rendered="#{not empty consentController.editConsent.template}"
										 update=":main, :title, :help, new" value="#{cmsg['ui.button.save']}"
										 widgetVar="saveConsentButton" />
						<p:commandButton actionListener="#{consentController.onCancelEdit}" icon="mdi mdi-close" immediate="true"
										 styleClass="secondary" update=":main, :title, :help, new" value="#{cmsg['ui.button.cancel']}" />
					</p:panel>
				</h:form>
			</ui:fragment>

			<ui:fragment rendered="#{embeddedController.done}">

				<!-- Print / Download -->
				<p:panel styleClass="text-center mb-3" rendered="#{embeddedController.printButton or embeddedController.pdfDownloadButton}">
					<h:form>
						<p:commandLink icon="mdi mdi-printer" action="#{consentController.onPrintConsent(consentController.editConsent)}" ajax="false"
									   rendered="#{embeddedController.printButton}"
									   target="blank"
									   styleClass="ui-button ui-corner-all ui-button-text-icon-left ui-state-default vertical-align-bottom">
							<h:outputText styleClass="ui-button-icon-left ui-icon ui-c mdi mdi-printer relative" style="top: 4px;" value="" />
							<h:outputText styleClass="ui-button-text ui-c relative" style="top: 4px;"
										  value="#{msg['common.button.print']}" />
						</p:commandLink>

						<p:commandButton actionListener="#{consentController.onDownloadConsentPDF(consentController.editConsent)}"
										 ajax="false"
										 icon="mdi mdi-download"
										 rendered="#{embeddedController.pdfDownloadButton}"
										 value="#{msg['page.consents.prefill.downloadPDF']}">
							<p:fileDownload value="#{consentController.downloadFile}" />
						</p:commandButton>
					</h:form>
				</p:panel>

				<!-- Auto Redirect -->
				<h:outputScript rendered="#{not embeddedController.printButton and not embeddedController.pdfDownloadButton and not empty embeddedController.redirect}" library="js">
					#{embeddedController.redirectInIFrame ? 'self.' : 'top.'}location.href = '#{embeddedController.getRedirectWithSignerIds(consentController.editConsent.key.orderedSignerIds)}';
				</h:outputScript>

				<!-- Button Redirect / Restart -->
				<p:panel styleClass="text-center" rendered="#{not empty embeddedController.redirect}">
					<p:commandButton value="#{msg['page.consents.prefill.finish']}" icon="mdi mdi-check"
									 onclick="#{embeddedController.redirectInIFrame ? 'self.' : 'top.'}location.href = '#{embeddedController.getRedirectWithSignerIds(consentController.editConsent.key.orderedSignerIds)}';" />
				</p:panel>
				<p:panel styleClass="text-center" rendered="#{empty embeddedController.redirect and not embeddedController.prefilledSignerId}">
					<p:commandButton value="#{msg['page.consents.prefill.newParticipant']}" icon="mdi mdi-reload" onclick="window.location.reload();" />
				</p:panel>
			</ui:fragment>
		</h:panelGroup>

		<h:panelGroup layout="block" id="print">
			<ui:fragment rendered="#{consentController.consentPageMode == 'PRINT'}">
				<h:form>
					<h:panelGroup layout="block" styleClass="print">
						<ui:repeat value="#{consentController.printConsents}" var="_consent" varStatus="_status">
							<components:consent_form consent="#{_consent}" consentController="#{consentController}" />
							<div class="#{_status.last ? '' : 'newPage'}"></div>
						</ui:repeat>
					</h:panelGroup>
				</h:form>
			</ui:fragment>
		</h:panelGroup>
	</ui:define>
</ui:composition>
</body>
</html>
