template.help.READ                                                    = Hier k\u00F6nnen Sie Vorlagen (Templates) f\u00FCr Einwilligungen erstellen, bearbeiten, duplizieren, l\u00F6schen, drucken und sich den Modulbaum anzeigen lassen.<br/>\
                                                                        Mit einem Rechtsklick auf die Tabelle erreichen Sie zus\u00E4tzliche Optionen.
template.help.EDIT                                                    = <ul><li>Sie k\u00F6nnen die <strong>Bezeichnung</strong> \u00E4ndern, nicht aber den Schl\u00FCssel, welcher die Vorlage in anderen Anwendungen referenziert.</li>\
                                                                        <li>Sofern die Vorlage noch im Entwurfsstadium ist, k\u00F6nnen Sie mit dem Texteditor <strong>Titel</strong>, <strong>Kopf-</strong> und <strong>Fu\u00DFzeile</strong> bearbeiten.</li>\
                                                                        <li>\u00DCber den Button <strong>Module suchen und sortieren</strong> k\u00F6nnen Sie vorhandene Module ausw\u00E4hlen oder Neue erstellen.</li>\
                                                                        <li>Nach Auswahl der Module k\u00F6nnen Sie die <strong>Antwortm\u00F6glichkeiten</strong> des Nutzers festlegen.</li>\
                                                                        <li>Bei Bedarf k\u00F6nnen Sie au\u00DFerdem benutzerdefinierte <strong>Eingabefelder</strong> hinzuf\u00FCgen.</li>\
                                                                        <li>Soll die Einwilligung oder einzelne Bestandteile ablaufen, k\u00F6nnen Sie dies unter <strong>Sonstiges</strong> und in der <strong>Modulliste</strong> angeben.</li></ul>
template.help.NEW                                                     = <ul><li>W\u00E4hlen Sie zuerst den <strong>Typ</strong> der Vorlage aus und vergeben Sie eine <strong>Bezeichnung</strong> sowie eine <strong>Version</strong>.</li>\
                                                                        <li>Danach k\u00F6nnen Sie mit dem Texteditor <strong>Titel</strong>, <strong>Kopf-</strong> und <strong>Fu\u00DFzeile</strong> hinzuf\u00FCgen.</li>\
                                                                        <li>\u00DCber den Button <strong>Module suchen und sortieren</strong> k\u00F6nnen Sie vorhandene Module ausw\u00E4hlen oder Neue erstellen.</li>\
                                                                        <li>Nach Auswahl der Module k\u00F6nnen Sie die <strong>Antwortm\u00F6glichkeiten</strong> des Nutzers festlegen.</li>\
                                                                        <li>Bei Bedarf k\u00F6nnen Sie au\u00DFerdem benutzerdefinierte <strong>Eingabefelder</strong> hinzuf\u00FCgen.</li>\
                                                                        <li>Soll die Einwilligung oder einzelne Bestandteile ablaufen, k\u00F6nnen Sie dies unter <strong>Sonstiges</strong> und in der <strong>Modulliste</strong> angeben.</li></ul>
