consent.help.type_                                                    = Hier sehen Sie eine Liste aller vorhanden Dokumente. Anhand des Symbols in der linken Spalte erkennen Sie den Dokumententyp.
consent.help.type_CONSENT                                             = Hier k\u00F6nnen Sie neue Einwilligungen erfassen oder vorhandene Einwilligungen anzeigen lassen.<br/>\r\nMit einem Rechtsklick auf eine Zeile \u00F6ffnen Sie zus\u00E4tzliche Optionen.
consent.help.type_REFUSAL                                             = Eine Ablehnung ist die Aussage eines Teilnehmers, an einer Studie/Register nicht teilnehmen zu wollen. Der Status entspricht einer Person, die nie gefragt wurde.<br/>\r\nLag zuvor bereits eine Einwilligung vor, muss ein Widerruf ausgef\u00FCllt werden.<br/>\r\nMit einem Rechtsklick auf eine Zeile \u00F6ffnen Sie zus\u00E4tzliche Optionen.
consent.help.type_REVOCATION                                          = Ein Widerruf ist die R\u00FCcknahme einer zuvor gegebenen Einwilligung. Im Gegensatz zur Ablehnung hat der Teilnehmer also bereits an der Studie/Register teilgenommen.<br/>\r\nMit einem Rechtsklick auf eine Zeile \u00F6ffnen Sie zus\u00E4tzliche Optionen.
consent.help.type_OBJECTION                                           = Ein Widerspr\u00FCch ist die Aussage eines Teilnehmers, an einer Studie/Register nicht mehr teilnehmen zu wollen, in welche er vorher durch eine Einwilligung (Opt-Out) eingeschlossen wurde.<br/>\r\nMit einem Rechtsklick auf eine Zeile \u00F6ffnen Sie zus\u00E4tzliche Optionen.
consent.help.type_CONSENT_OPT_OUT                                     = Eine Einwilligung (Opt-Out) schlie\u00DFt einen Teilnehmer in eine Studie/Register ein, ohne dass er daf\u00FCr eine Einwilligung ausf\u00FCllen muss.<br/>\r\nMit einem Rechtsklick auf eine Zeile \u00F6ffnen Sie zus\u00E4tzliche Optionen.
